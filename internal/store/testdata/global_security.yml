components:
    securitySchemes:
        ApiKeyAuth:
            in: header
            name: X-API-Key
            type: apiKey
        BearerAuth:
            scheme: bearer
            type: http
info:
    title: Secured API
    version: 1.0.0
openapi: 3.0.0
paths:
    /public:
        get:
            responses:
                "200":
                    description: OK
            security: []
            summary: Public endpoint
        post:
            responses:
                "201":
                    description: Created
            security:
                - BearerAuth: []
            summary: Override security
    /secure:
        get:
            requestBody:
                content:
                    application/json: {}
            responses:
                "200":
                    description: OK
            security:
                - ApiKeyAuth: []
                - BearerAuth: []
            summary: Secured endpoint
security:
    - ApiKeyAuth: []
    - BearerAuth: []
