version: 2

project_name: lazyapi

before:
  hooks:
    - go mod tidy

builds:
  - id: binary
    main: ./cmd/lazyapi
    binary: lazyapi

    goos:
      - linux
      - windows
      - darwin

    goarch:
      - amd64
      - arm64

archives:
  - id: archive

    formats:
      - tar.gz

    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: checksums.txt

changelog:
  use: github

release:
  draft: false
  prerelease: auto
  footer: |
    Full changelog available in GitHub.

source:
  enabled: true
