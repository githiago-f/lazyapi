# Named environments: lazyapi run examples/openapi.yml --env-name production
# The TUI cycles them with ctrl+v. Each environment reads envs/<name>.env
# (committed) and secrets/<name>.env (git-ignored) from this directory.
default: local
environments:
  local:
    server: http://127.0.0.1:4010   # lazyapi mock examples/openapi.yml
    vars:
      tenant: demo
  production:
    server: "1"                     # index into the spec's servers
    # credentials: create secrets/production.env (never committed)
