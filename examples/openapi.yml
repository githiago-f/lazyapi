info:
    description: A sample OpenAPI spec for testing lazyapi
    title: Example API
    version: 1.0.0
openapi: 3.0.0
paths:
    /sales:
        post:
            responses:
                "200":
                    description: OK
            summary: Create a sale
    /sales/{id}:
        delete:
            responses:
                "200":
                    description: OK
            summary: Delete specified sale
        get:
            responses:
                "200":
                    description: OK
            summary: View a sale
        patch:
            responses:
                "200":
                    description: OK
            summary: Patch sale
    /users:
        get:
            operationId: listUsers
            parameters:
                - description: Maximum number of users to return
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Number of users to skip
                  in: query
                  name: offset
                  schema:
                    type: integer
            responses:
                "200":
                    description: A list of users
            summary: List all users
        post:
            operationId: createUser
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    type: string
                                name:
                                    type: string
                            type: object
            responses:
                "201":
                    description: User created
            summary: Create a new user
    /users/{id}:
        delete:
            operationId: deleteUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: User deleted
            summary: Delete a user
        get:
            operationId: getUser
            parameters:
                - description: The user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: A single user
            summary: Get a user by ID
servers:
    - description: Production
      url: https://api.example.com/v1
    - description: Staging
      url: https://staging.example.com/v1
    - description: Local development
      url: http://localhost:3000
