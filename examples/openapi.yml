components:
    schemas:
        Credentials:
            properties:
                email:
                    format: email
                    type: string
                password:
                    minLength: 1
                    type: string
            required:
                - email
                - password
            type: object
        Error:
            properties:
                error:
                    type: string
            required:
                - error
            type: object
        NewUser:
            properties:
                email:
                    format: email
                    type: string
                name:
                    minLength: 1
                    type: string
            required:
                - name
                - email
            type: object
        User:
            allOf:
                - $ref: '#/components/schemas/NewUser'
                - properties:
                    id:
                        minimum: 1
                        type: integer
                    role:
                        enum:
                            - admin
                            - member
                        type: string
                  required:
                    - id
                    - role
                  type: object
info:
    description: |
        A runnable example for LazyAPI. Start the mock and run the tests:

          lazyapi mock examples/openapi.yml &
          lazyapi run examples/openapi.yml --methods all
    title: Example Users API
    version: 1.0.0
openapi: 3.0.0
paths:
    /auth/login:
        post:
            description: Login example
            operationId: login
            parameters:
                - in: query
                  name: Variavel
                  schema:
                    type: string
            requestBody:
                content:
                    application/json:
                        example:
                            email: ana@example.com
                            password: secret
                        schema:
                            $ref: '#/components/schemas/Credentials'
                required: true
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                token: mock-token
                            schema:
                                properties:
                                    token:
                                        type: string
                                required:
                                    - token
                                type: object
                    description: Logged in
                "401":
                    content:
                        application/json:
                            example:
                                error: invalid credentials
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Wrong credentials
            summary: Exchange credentials for a token
            tags:
                - auth
            x-lazyapi-tests: .lazyapi/tests/login.js
    /health:
        get:
            operationId: healthCheck
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                status: ok
                            schema:
                                properties:
                                    status:
                                        enum:
                                            - ok
                                            - degraded
                                        type: string
                                required:
                                    - status
                                type: object
                    description: The service is up
            summary: Service health
            tags:
                - system
            x-lazyapi-tests: .lazyapi/tests/healthCheck.js
    /users:
        get:
            operationId: listUsers
            parameters:
                - in: query
                  name: limit
                  schema:
                    default: 10
                    maximum: 100
                    minimum: 1
                    type: integer
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                - email: ana@example.com
                                  id: 1
                                  name: Ana Souza
                                  role: admin
                                - email: bruno@example.com
                                  id: 2
                                  name: Bruno Lima
                                  role: member
                            schema:
                                items:
                                    $ref: '#/components/schemas/User'
                                type: array
                    description: A page of users
            summary: List users
            tags:
                - users
            x-lazyapi-tests: .lazyapi/tests/listUsers.js
        post:
            operationId: createUser
            requestBody:
                content:
                    application/json:
                        example:
                            email: carla@example.com
                            name: '{{$displayName}}'
                        schema:
                            $ref: '#/components/schemas/NewUser'
                required: true
            responses:
                "201":
                    content:
                        application/json:
                            example:
                                email: carla@example.com
                                id: 3
                                name: Carla Dias
                                role: member
                            schema:
                                $ref: '#/components/schemas/User'
                    description: Created
                "422":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: Invalid user
            summary: Create a user
            tags:
                - users
            x-lazyapi-tests: .lazyapi/tests/createUser.js
    /users/{id}:
        delete:
            operationId: deleteUser
            responses:
                "204":
                    description: Deleted
                "404":
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such user
            summary: Delete a user
            tags:
                - users
        get:
            operationId: getUser
            responses:
                "200":
                    content:
                        application/json:
                            example:
                                email: ana@example.com
                                id: 1
                                name: Ana Souza
                                role: admin
                            schema:
                                $ref: '#/components/schemas/User'
                    description: The user
                "404":
                    content:
                        application/json:
                            example:
                                error: user not found
                            schema:
                                $ref: '#/components/schemas/Error'
                    description: No such user
            summary: Get a user
            tags:
                - users
            x-lazyapi-tests: .lazyapi/tests/getUser.js
        parameters:
            - example: 1
              in: path
              name: id
              required: true
              schema:
                minimum: 1
                type: integer
servers:
    - description: lazyapi mock (local)
      url: http://127.0.0.1:4010
    - description: production (illustrative)
      url: https://api.example.com/v1
tags:
    - name: system
    - name: auth
    - name: users
