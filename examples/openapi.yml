components:
    securitySchemes:
        lazyapi_auth_0:
            in: header
            type: apiKey
        lazyapi_auth_1:
            scheme: basic
            type: http
info:
    description: A sample OpenAPI spec for testing lazyapi
    title: Example API
    version: 1.0.0
openapi: 3.0.0
paths:
    /sales:
        post:
            parameters:
                - in: query
                  name: field
                  schema:
                    type: string
            requestBody:
                content:
                    application/json: {}
            responses:
                "200":
                    content:
                        text/plain:
                            example: |
                                OK
                    description: OK
            summary: Create a sale
            tags:
                - Sales
    /sales/{id}:
        delete:
            responses:
                "200":
                    description: OK
            summary: Delete specified sale
            tags:
                - Sales
        get:
            responses:
                "200":
                    description: OK
            summary: View a sale
            tags:
                - Sales
        patch:
            responses:
                "200":
                    description: OK
            summary: Patch sale
            tags:
                - Sales
    /users:
        get:
            operationId: listUsers
            parameters:
                - description: Maximum number of users to return
                  in: query
                  name: limit
                  schema:
                    type: integer
                - description: Number of users to skip
                  in: query
                  name: offset
                  schema:
                    type: integer
                - in: header
                  name: l
                  schema:
                    type: string
            requestBody:
                content:
                    application/json: {}
            responses:
                "200":
                    description: A list of users
            security:
                - lazyapi_auth_0: []
                - lazyapi_auth_1: []
            summary: List all users
            tags:
                - Users
        post:
            operationId: createUser
            requestBody:
                content:
                    application/json:
                        schema:
                            properties:
                                email:
                                    type: string
                                name:
                                    type: string
                            type: object
            responses:
                "201":
                    description: User created
            summary: Create a new user
            tags:
                - Users
    /users/{id}:
        delete:
            operationId: deleteUser
            parameters:
                - in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "204":
                    description: User deleted
            summary: Delete a user
            tags:
                - Users
        get:
            operationId: getUser
            parameters:
                - description: The user ID
                  in: path
                  name: id
                  required: true
                  schema:
                    type: string
            responses:
                "200":
                    description: A single user
            summary: Get a user by ID
            tags:
                - Users
servers:
    - description: Production
      url: https://api.example.com/v1
    - description: Staging
      url: https://staging.example.com/v1
    - description: Local development
      url: http://localhost:3000
