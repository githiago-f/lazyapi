name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docs:
    runs-on: ubuntu-latest
    needs: release

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Extract major version
        run: |
          TAG="${{ github.ref_name }}"
          MAJOR="${TAG#v}"
          MAJOR="${MAJOR%%.*}"
          echo "DOCS_VERSION=$MAJOR" >> $GITHUB_ENV
          echo "docs version: v$MAJOR"

      - name: Build docs
        run: |
          cd docs
          npm ci
          bash scripts/extract-docs.sh
          DOCS_VERSION=$DOCS_VERSION npx vitepress build
          mkdir -p "../dist/v$DOCS_VERSION"
          cp -r .vitepress/dist/* "../dist/v$DOCS_VERSION/"
          # Create latest symlink
          cd ../dist
          rm -f latest
          ln -s "v$DOCS_VERSION" latest

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          keep_files: true
