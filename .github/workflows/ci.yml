name: CI

on:
  pull_request:
    branches:
      - main
      - master

  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  verify:
    name: Build, Vet, Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download Dependencies
        run: go mod download

      - name: Verify Modules
        run: go mod verify

      - name: Formatting
        run: |
          unformatted=$(gofmt -l $(git ls-files '*.go'))
          if [ -n "$unformatted" ]; then
            echo "::error::run gofmt -w on these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Go Vet
        run: go vet ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: latest

      - name: Build
        run: go build ./...

      - name: Test
        run: |
          set -o pipefail
          go test -race -count=1 -covermode=atomic -coverprofile=coverage.out ./... | tee test.log

      - name: Coverage
        env:
          MIN_COVERAGE: "55"
        run: |
          total=$(go tool cover -func=coverage.out | awk '/^total:/ {sub("%", "", $3); print $3}')
          {
            echo "### Coverage: ${total}% (minimum ${MIN_COVERAGE}%)"
            echo
            echo '| Package | Coverage |'
            echo '|---|---|'
            awk '/coverage: [0-9]/ { pkg = ($1 == "ok") ? $2 : $1; for (i = 1; i <= NF; i++) if ($i == "coverage:") printf "| %s | %s |\n", pkg, $(i+1) }' test.log | sed 's#github.com/githiago-f/lazyapi/##' | sort
          } >> "$GITHUB_STEP_SUMMARY"
          echo "total coverage: ${total}%"
          awk -v t="$total" -v m="$MIN_COVERAGE" 'BEGIN { exit (t + 0 < m + 0) }' || { echo "::error::coverage ${total}% is below ${MIN_COVERAGE}%"; exit 1; }

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out


  examples:
    name: Example API tests (against lazyapi mock)
    runs-on: ubuntu-latest
    needs: verify

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build -o lazyapi ./cmd/lazyapi

      - name: Validate example spec
        run: ./lazyapi validate spec examples/openapi.yml

      - name: Start mock server
        run: |
          ./lazyapi mock examples/openapi.yml --port 4010 --quiet &
          for i in $(seq 1 50); do curl -sf http://127.0.0.1:4010/health && exit 0; sleep 0.1; done
          echo "mock did not start" && exit 1

      - name: Run example tests
        run: |
          ./lazyapi run examples/openapi.yml --methods all --flows --frozen-lockfile \
            --output junit --output-file lazyapi-report.xml

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lazyapi-report
          path: lazyapi-report.xml
